name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @evobridge/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image and smoke test it
        run: |
          docker build -t evobridge:ci .
          docker run -d --name eb -p 3000:3000 evobridge:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/healthz
          curl -sf localhost:3000/ | grep -q '<html'
          docker stop eb
